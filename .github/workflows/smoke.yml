# 冒烟验收：离线跑通看板状态机闭环（board / assign / set-result / complete）+ doctor/setup/deploy 自测 + 镜像层单测
# 失败即 CI 红。脚本零第三方依赖，见 CONTRIBUTING.md。
name: smoke

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 运行冒烟测试
        run: python3 tests/smoke_test.py

      - name: 运行 doctor 自检自测
        run: python3 tests/doctor_test.py

      - name: 运行 setup 一键初始化自测
        run: python3 tests/setup_test.py

      - name: 运行镜像层自测（状态映射 + mock RPC 路径）
        run: python3 tests/mirror_test.py

      - name: 运行 deploy.sh 端到端冒烟（一键部署闭环 + 新机制断言）
        run: python3 tests/deploy_smoke_test.py

      - name: 运行批次 3 验收（O6 决策卡 + O7b 巡检）
        run: python3 tests/decision_sweep_test.py

      - name: 运行批次 4 验收（O8 blocked 态 + O9 sticky cancel）
        run: python3 tests/blocked_cancel_test.py
